display:flex;align-items:center;gap:13px;margin:18px 0;flex-wrap:wrap}.controls button,.smallbtn{border:1px solid #cbd5e1;border-radius:7px;padding:10px 17px;background:white;color:var(--ink);font-size:19px}.controls .primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}.readout{font-size:22px;line-height:1.6;min-height:75px;color:var(--pink);font-weight:600}.steptext{background:#eff6ff;padding:18px 22px;border-radius:12px;font-size:24px;line-height:1.5;margin-top:15px;min-height:74px}.inputs{display:flex;gap:18px;flex-wrap:wrap;margin:22px 0}.inputs label{font-size:21px;color:var(--muted)}.inputs input{display:block;width:110px;margin-top:8px;border:1px solid #cbd5e1;border-radius:6px;padding:9px;color:var(--ink);background:white;font-size:23px}.foot{position:absolute;bottom:23px;left:82px;right:82px;display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}.dark .foot{color:#94a3b8}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:35px}.card{padding:28px 30px;background:white;border-radius:24px;box-shadow:0 8px 20px #1e293b08}.card h3{padding-bottom:22px;border-bottom:1px solid #e2e8f0}.card p{font-size:23px;margin-top:25px}.card .answer{color:var(--pink);font-size:29px;font-weight:700;background:#f1f5f9;border-radius:10px;padding:18px;margin-top:25px}svg{width:100%;height:auto;display:block}svg text{font-family:'Malgun Gothic',sans-serif}svg .edge{stroke:#94a3b8;stroke-width:3;fill:none}svg .rev{stroke:#e51b78;stroke-width:4;fill:none}svg .node{fill:white;stroke:#1e293b;stroke-width:3}svg .lit{fill:#eff6ff;stroke:#2962ff;stroke-width:5}svg .dim{opacity:.13}.toolbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#cbd5e1;border-top:1px solid #263449;gap:15px}.toolbar button{color:#cbd5e1;border:0;background:transparent;padding:10px 12px;border-radius:5px;font-size:15px}.toolbar button:hover{background:#263449}.toolbar .nav{display:flex;align-items:center;gap:9px}#progress{position:fixed;bottom:66px;left:0;height:3px;background:var(--pink);transition:width .25s}.overlay{position:fixed;inset:0;background:#020617b0;z-index:10;display:grid;place-items:center;padding:25px}.overlay[hidden]{display:none}.dialog{max-width:850px;width:100%;max-height:85vh;overflow:auto;background:white;border-radius:16px;padding:32px;color:var(--ink)}.dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.dialog h2{font-size:27px;letter-spacing:0;margin:0}.dialog p{font-size:20px}.dialog button{border:1px solid #cbd5e1;background:white;border-radius:6px;padding:10px;font-size:17px}.toc{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toc button{text-align:left}.toc .selected{border-color:var(--blue);color:var(--blue)}.sr{position:absolute;left:-9999px}#count{min-width:66px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}@media(max-width:650px){.toolbar{padding:0 5px}.toolbar button{padding:10px 7px;font-size:13px}.brand{display:none}.toc{grid-template-columns:1fr}}@media print{@page{size:landscape;margin:0}body{background:white}#viewport,#frame{display:block;height:auto!important;width:auto!important;overflow:visible}#deck{transform:none!important;width:1440px;height:auto}.slide{display:block!important;position:relative;width:1440px;height:810px;break-after:page}.toolbar,.overlay,#progress,.controls{display:none!important}}
#apple-graph{height:260px}#apple-graph svg{height:260px}#orange-graph{height:340px}#orange-graph svg{height:340px}.slide:has(#apple-graph) .steptext{margin-top:10px}.slide:has(#orange-graph) .controls{margin:10px 0}</style></head><body><main id="viewport"><div id="frame"><article id="deck" aria-label="연쇄법칙과 역전파 발표자료"></article></div></main><div id="progress"></div><nav class="toolbar" aria-label="발표 도구"><span class="brand">5.2–5.3 <span style="color:#64748b">/ 교재 153–160쪽</span></span><div class="nav"><button id="prev" aria-label="이전 슬라이드">← 이전</button><span id="count"></span><button id="next" aria-label="다음 슬라이드">다음 →</button></div><div><button id="toc">목차</button><button id="notes">발표 노트</button><button id="full">전체화면</button><button id="download">HTML 저장</button></div></nav><div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button id="close" aria-label="창 닫기">닫기 ×</button></header><div id="dialog-body"></div></section></div><span id="announce" class="sr" aria-live="polite"></span>
<script>
const $=id=>document.getElementById(id), fmt=n=>Number(n.toFixed(4)).toLocaleString('en-US');
const slides=[
{title:'오차역전파법의 원리',cls:'dark',page:'153–160',html:`<div class="section center"><div class="eyebrow">CHAPTER 5.2 – 5.3</div><h1>오차역전파법의 원리</h1><p class="subtitle" style="font-size:32px;margin-top:45px">연쇄법칙과 계산 그래프를 통한 효율적인 미분 계산</p><div class="underline" style="margin-top:65px"></div><p class="note" style="color:#94a3b8">5.2 연쇄법칙 · 5.3 역전파</p></div>`,note:'이번 범위는 교재 인쇄 쪽수 153~160쪽, 5.2와 5.3입니다. 160쪽에서 시작하는 5.4의 계층 구현은 포함하지 않습니다. 순전파로 계산한 값을 이용해, 최종 출력이 각 입력에 얼마나 민감한지 역전파로 구하는 과정을 살펴봅니다.'},
{title:'5.2 연쇄법칙',page:'153–155',html:`<div class="section center"><h1>5.2 연쇄법칙</h1><div class="underline"></div><p class="subtitle" style="font-size:32px">Chain Rule</p></div>`,note:'5.2.1은 노드에서의 역전파, 5.2.2는 합성함수의 미분, 5.2.3은 연쇄법칙과 계산 그래프의 관계를 다룹니다.'},
{title:'계산 그래프의 역전파',page:'153',html:`<div class="eyebrow">5.2.1</div><h2>계산 그래프의 역전파</h2><div class="columns"><div><div class="callout">상류 미분값 × 국소적 미분</div><p>노드로 들어온 미분값에<br>그 노드의 미분을 곱해 전달한다.</p><div class="formula pink" style="margin-top:30px">∂L/∂x = E · ∂y/∂x</div><p class="note">E = ∂L/∂y, 예: y = x²</p></div><div><div id="local-graph"></div><div class="inputs"><label>x<input id="local-x" type="number" value="3" min="-20" max="20"></label><label>상류 E<input id="local-e" type="number" value="1" step="0.1" min="-20" max="20"></label></div><div id="local-result" class="readout"></div></div></div>`,note:'순전파에서는 입력 x로 y=f(x)를 계산합니다. 역전파에서는 최종 출력 L의 y에 대한 미분 E가 오른쪽에서 들어옵니다. y=x²이면 국소적 미분은 2x이므로 E·2x를 왼쪽에 전달합니다. x와 E를 바꿔 확인하세요.'},
{title:'연쇄법칙과 합성함수',page:'153–154',html:`<div class="eyebrow">5.2.2</div><h2>연쇄법칙 (Chain Rule)</h2><div class="columns"><div><h3>여러 함수를 연결한 합성함수</h3><p style="margin-top:25px">z = (x + y)²를 두 단계로 나누면<br>각 단계의 미분을 구하기 쉬워진다.</p><div class="callout">합성함수의 미분은<br>각 함수의 미분을 곱해 구한다.</div><p class="note">x에 대해 미분할 때 y는 고정한다.</p></div><div class="panel center"><p class="subtitle">수식의 분해</p><div class="formula bigformula" style="margin:25px">z = (x + y)²</div><p class="subtitle">중간 변수 t</p><div class="formula" style="margin:25px"><span class="blue">t = x + y</span><br><span class="pink">z = t²</span></div><div class="formula">∂z/∂x = (∂z/∂t) · (∂t/∂x)</div></div></div>`,note:'교재의 예제는 z=(x+y)²입니다. t=x+y, z=t²로 분해합니다. ∂z/∂t=2t, ∂t/∂x=1이므로 ∂z/∂x=2(x+y)입니다. 첨부 PDF의 괄호 누락과 세로로 깨진 문장은 교재에 맞추어 정리했습니다.'},
{title:'국소적 미분의 연쇄 연산',page:'154–155',cls:'pale',html:`<div class="center"><div class="eyebrow">5.2.3 연쇄법칙과 계산 그래프</div><h2>국소적 미분의 연쇄 연산</h2><p class="subtitle">순전파와 역전파를 한 단계씩 확인한다</p></div><div id="chain-graph" style="max-width:1050px;margin:15px auto"></div><div class="controls"><button id="chain-reset">처음부터</button><button class="primary" id="chain-next">다음 단계</button><span class="note" style="margin:0" id="chain-count"></span></div><div class="steptext" id="chain-text"></div>`,note:'설명을 위한 대입 예제 x=3,y=2를 사용합니다. t=5, z=25입니다. 역전파 초기값은 ∂z/∂z=1입니다. 제곱 노드에서 1×2t=10을 보내고, 덧셈 노드는 10을 x와 y 양쪽으로 보냅니다. 따라서 ∂z/∂x=∂z/∂y=10입니다. 교재의 일반식은 2(x+y)입니다.'},
{title:'5.3 역전파',page:'155–160',html:`<div class="section center"><h1>5.3 역전파</h1><div class="underline"></div><p class="subtitle" style="font-size:32px">덧셈 노드와 곱셈 노드의 역전파 구조</p></div>`,note:'이제 연쇄법칙을 실제 연산에 적용합니다. 덧셈과 곱셈은 국소적 미분이 다르므로 상류 미분값을 전달하는 규칙도 다릅니다.'},
{title:'덧셈 노드의 역전파',page:'156–157',html:`<div class="eyebrow">5.3.1</div><h2>덧셈 노드의 역전파</h2><div class="columns"><div><div class="callout">상류의 미분값을 그대로 전달</div><div class="formula">z = x + y<br>∂z/∂x = 1, ∂z/∂y = 1</div><p class="note">각 입력 방향으로 1을 곱한다.<br>상류 미분값을 양쪽에 각각 전달한다.</p><div class="inputs"><label>상류 미분값 g<input id="add-g" type="number" value="1.3" min="-20" max="20" step="0.1"></label></div></div><div><div class="panel" id="add-graph"></div><div id="add-result" class="readout"></div></div></div>`,note:'교재 예제는 10+5=15입니다. 상류 미분값 g=1.3을 받으면 두 입력에 각각1.3을 보냅니다. g를 반으로 나누는 것이 아닙니다. g를 바꿔 두 하류 값이 항상 같음을 확인하세요.'},
{title:'곱셈 노드의 역전파',page:'157–159',html:`<div class="eyebrow">5.3.2</div><h2>곱셈 노드의 역전파</h2><div class="columns"><div><div class="callout" style="border-color:var(--blue)">다른 쪽 입력값을 곱해 전달</div><div class="formula">z = xy<br>∂z/∂x = y, ∂z/∂y = x</div><p class="note">역전파에서 쓰기 위해 순전파의 입력 x, y를 저장한다.</p><div class="inputs"><label>x<input id="mul-x" type="number" value="10" min="-50" max="50"></label><label>y<input id="mul-y" type="number" value="5" min="-50" max="50"></label><label>상류 g<input id="mul-g" type="number" value="1.3" step="0.1" min="-20" max="20"></label></div></div><div><div class="panel" id="mul-graph"></div><div id="mul-result" class="readout"></div></div></div>`,note:'z=xy이면 x에 대한 국소적 미분은 y이고 y에 대한 미분은 x입니다. x=10,y=5,g=1.3일 때 x 방향은6.5, y 방향은13입니다. 다른 쪽 입력을 곱한다는 뜻이지, 미분값 두 개를 서로 바꾼다는 뜻은 아닙니다.'},
{title:'사과 쇼핑 예제',page:'159',cls:'pale',html:`<div class="eyebrow">5.3.3</div><h2>사과 쇼핑 예제</h2><div class="inputs"><label>사과 가격 p (원)<input id="apple-p" type="number" value="100" min="0" max="10000"></label><label>개수 n<input id="apple-n" type="number" value="2" min="0" max="100" step="1"></label><label>세율 r (%)<input id="apple-r" type="number" value="10" min="0" max="100" step="1"></label></div><div id="apple-graph"></div><div class="controls"><button id="apple-reset">처음부터</button><button id="apple-next" class="primary">다음 단계</button><span id="apple-total" style="font-size:23px;margin-left:auto"></span></div><div id="apple-text" class="steptext"></div>`,note:'사과100원,2개,세율10%이면 세금 배율 a=1.1이고 최종금액 L=220원입니다. 역전파 시작값1에서 ∂L/∂q=1.1, ∂L/∂a=200을 얻습니다. 첫 곱셈에서 ∂L/∂p=2.2, ∂L/∂n=110입니다. 세율을1%포인트 바꾸면 배율은0.01 바뀌므로 최종금액 변화는2원입니다. 교재의 소비세1.1은 세금이 포함된 배율을 뜻합니다.'},
{title:'사과와 귤 쇼핑 예제',page:'159–160',cls:'pale',html:`<div class="eyebrow">5.3.3 연습문제</div><h2>사과와 귤 쇼핑의 역전파</h2><p class="subtitle">사과 100원 × 2개, 귤 150원 × 3개, 세금 배율 1.1</p><div id="orange-graph" style="max-width:1050px;margin:0 auto"></div><div class="controls"><button id="orange-reset">처음부터</button><button id="orange-next" class="primary">다음 단계</button></div><div id="orange-text" class="steptext"></div>`,note:'사과 소계200원, 귤 소계450원, 세전 합계650원, 최종금액715원입니다. 마지막 곱셈 노드에서 합계 방향1.1, 배율 방향650입니다. 덧셈은1.1을 두 소계에 그대로 전달합니다. 사과가격2.2, 사과개수110, 귤가격3.3, 귤개수165입니다. 각 역전파 값을 차례로 확인하세요.'},
{title:'각 변수의 영향력',page:'153–160',cls:'pale',html:`<div class="center"><div class="eyebrow">5.2–5.3 정리</div><h2>계산 그래프를 통한 미분 산출</h2><p class="subtitle">사과 쇼핑 기본값 p = 100, n = 2, a = 1.1 기준</p></div><div class="three"><div class="card"><h3>사과 가격</h3><p>가격이 1원 오르면<br>최종 금액은 2.2원 증가한다.</p><div class="answer">∂L/∂p = 2.2</div></div><div class="card"><h3>사과 개수</h3><p>사과를 1개 더 사면<br>최종 금액은 110원 증가한다.</p><div class="answer">∂L/∂n = 110</div></div><div class="card"><h3>세금 배율</h3><p>세율 1%포인트 상승 시<br>200 × 0.01 = 2원 증가한다.</p><div class="answer">∂L/∂a = 200</div></div></div><div class="steptext center" style="margin-top:40px">역전파는 연쇄법칙에 따라 국소적 미분을 곱해 전달하는 계산이다.</div>`,note:'가격과 개수, 세금 배율은 단위가 다릅니다. 미분값의 크기만으로 어느 변수가 더 중요하다고 비교하지 않습니다. 배율1은100%에 해당하며 세율1%포인트는 배율0.01 변화입니다. 개수는 연속 변수처럼 미분한 값을 해석합니다. 이 예제는 다른 변수를 고정하면 각 입력에 대해 선형이므로 한 단위 변화도 정확히 계산됩니다.'},
{title:'Q&A',page:'153–160',cls:'dark',html:`<div class="section center"><div class="eyebrow" style="font-size:55px">≋</div><h1>Q&A</h1><p class="subtitle" style="font-size:32px;margin-top:35px">경청해 주셔서 감사합니다.</p><p class="note" style="color:#94a3b8;margin-top:65px">왜 덧셈은 그대로 전달하고, 곱셈은 다른 입력을 곱할까요?</p></div>`,note:'답: 각 노드의 국소적 미분이 다르기 때문입니다. 덧셈의 국소적 미분은1이고 곱셈의 국소적 미분은 다른 입력값입니다. 출처는 사이토 고키의 밑바닥부터 시작하는 딥러닝5.2–5.3,153–160쪽입니다. 디자인은 제공된 오차역전파법과 연쇄법칙PDF를 참고했습니다.'}
];

let current=0,lastFocus=null;function size(){let scale=Math.min(innerWidth/1440,(innerHeight-66)/810);$('frame').style.width=1440*scale+'px';$('frame').style.height=810*scale+'px';$('deck').style.transform=`scale(${scale})`;}function go(n){current=Math.max(0,Math.min(slides.length-1,n));document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current));$('count').textContent=`${current+1} / ${slides.length}`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('progress').style.width=(current+1)/slides.length*100+'%';$('announce').textContent=slides[current].title;history.replaceState(null,'','#'+(current+1));}
function modal(kind){lastFocus=document.activeElement;$('overlay').hidden=false;$('dialog-title').textContent=kind==='toc'?'목차':slides[current].title+' · 발표 노트';$('dialog-body').innerHTML=kind==='toc'?'<div class="toc">'+slides.map((s,i)=>`<button data-slide="${i}" class="${i===current?'selected':''}">${String(i+1).padStart(2,'0')}　${s.title}</button>`).join('')+'</div>':'<p>'+slides[current].note+'</p>';$('dialog-body').querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{go(+b.dataset.slide);close()});$('close').focus();}function close(){$('overlay').hidden=true;lastFocus?.focus();}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.();}

document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.key==='Escape')close();if(e.key==='Tab'){let els=[...$('overlay').querySelectorAll('button')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return;}if(/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='n')modal('notes');if(e.key.toLowerCase()==='o')modal('toc');if(e.key.toLowerCase()==='f')full();});let touch;document.querySelector('main').addEventListener('touchstart',e=>{if(!e.target.closest('input,button'))touch=e.touches[0].clientX},{passive:true});document.querySelector('main').addEventListener('touchend',e=>{if(touch!=null){let d=e.changedTouches[0].clientX-touch;if(Math.abs(d)>65)go(current+(d<0?1:-1));touch=null;}},{passive:true});
let svgSerial=0;function svg(content,w=650,h=320){let uid=++svgSerial;content=content.replaceAll("url(#a)",`url(#a${uid})`).replaceAll("url(#r)",`url(#r${uid})`);return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="계산 그래프"><defs><marker id="a${uid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker><marker id="r${uid}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e51b78"/></marker></defs>${content}</svg>`;}
