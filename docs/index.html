<div class="shell">

      <a href="https://www.semanticscholar.org" target="_blank" rel="noopener">Details from Semantic Scholar</a>
    </div>

  <header class="page-head">
    <h1>Paper Queue</h1>
  </header>

  <main>
    <div class="toolbar">
      <label class="select">
        <span class="sr">Sort</span>
        <select id="sort">
          <option value="person">By person</option>
          <option value="title">By title</option>

        <button type="button" data-view="all">All</button>

        <button type="button" data-view="reviewed">Reviewed</button>

      <a class="pill outline" href="map.html">Open map</a>

    <div id="notice" role="status" hidden></div>

    <section class="section" id="queue-section" aria-labelledby="queue-h">
      <h2 id="queue-h">To read <span class="n" id="queue-count"></span></h2>
      <ol class="grid" id="queue"></ol>
      <p id="queue-empty" class="empty">Loading…</p>
      <noscript><p class="empty">This page needs JavaScript. The lists themselves are in docs/papers/ on GitHub.</p></noscript>
    </section>

    <section class="section" id="reviewed-section" aria-labelledby="reviewed-h" hidden>
      <h2 id="reviewed-h">Reviewed <span class="n" id="reviewed-count"></span></h2>

    </section>
  </main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="shared.js"></script>
<script>
// Reading the lists and looking papers up live in shared.js, which the map uses too.
const META_KEY = 'air-paper-meta';
const META_TTL = 7 * 24 * 60 * 60 * 1000; // look papers up again weekly, for citation counts
const S2_FIELDS = 'title,authors,year,venue,publicationVenue,citationCount,abstract,citationStyles';

const search = $('q');
const sheet = $('sheet');

// ---------- Authors, venue and abstract from Semantic Scholar ----------

let lookups = {}; // paper key -> { at: when we looked, d: details or null }
try { lookups = JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch {}

// Keep only what the page shows. Venues use their short name (CVPR, ICLR) when there is one.
function trimMeta(d) {
  if (!d) return null;
  const short = (d.publicationVenue?.alternate_names || []).find(n => !/\s/.test(n) && n.length <= 10);
  let venue = short || d.venue || '';
  if (/^arxiv(\.org)?$/i.test(venue)) venue = 'arXiv';
  return {
    title: d.title || null,
    authors: (d.authors || []).map(a => a.name).filter(Boolean),
    year: d.year || null,
    venue,
    cited: d.citationCount ?? null,
    abstract: d.abstract || '',
    bibtex: d.citationStyles?.bibtex || '',
  };
}

const metaOf = p => lookups[p.key]?.d || null;

// Look up papers we haven't seen (or not this week) in one request. Returns whether anything changed.
async function loadMeta(list) {
  const now = Date.now();
  const todo = list.map(p => ({ key: p.key, id: s2Id(p) }))
    .filter(x => x.id && !(lookups[x.key] && now - lookups[x.key].at < META_TTL));
  for (let i = 0; i < todo.length; i += 500) {
    const chunk = todo.slice(i, i + 500);
    const found = await fetchJSON(`${S2_BATCH}?fields=${S2_FIELDS}`, { ids: chunk.map(x => x.id) });
    chunk.forEach((x, j) => { lookups[x.key] = { at: now, d: trimMeta(found[j]) }; });
  }
  if (todo.length) try { localStorage.setItem(META_KEY, JSON.stringify(lookups)); } catch {}
  return todo.length > 0;
}

// ---------- Rendering ----------

let papers = [], colors = new Map();
let sortBy = 'person', view = 'all', openKey = null;

const titleOf = p => p.title || metaOf(p)?.title || shortUrl(p.url);
const firstAuthor = info => info.authors.length ? info.authors[0] + (info.authors.length > 1 ? ' et al.' : '') : '';
const yearOf = p => metaOf(p)?.year ?? 0;
const citedOf = p => metaOf(p)?.cited ?? -1;

// Notes are plain text, except that links inside them stay clickable.
function appendNote(node, text) {
  const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>]*[^\s<>.,;:!?)\]])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    node.append(text.slice(last, m.index), link(m[2] || m[3], m[1] || shortUrl(m[3])));
    last = re.lastIndex;
  }
  node.append(text.slice(last));
}

// Clicking the tag or name that's already the search clears it.
function setQuery(q) {
  search.value = search.value.trim().toLowerCase() === q.toLowerCase() ? '' : q;
  filter();
}

// Filtering from further down the page scrolls back up to the results.
function pick(q) {
  setQuery(q);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function tagButton(tag, onClick) {
  const b = button('tag', null, onClick);
  if (isTopic(tag)) {
    const swatch = el('span', 'swatch');
    swatch.style.setProperty('--c', colors.get(tag.toLowerCase()) || 'var(--tag-none)');
    b.append(swatch);
  }
  b.append(tag);
  return b;
}

// Each paper is a card: venue and year, the title large, then authors and citations. Its caption says
// who listed it and how it's tagged, and any notes go under that.
function renderCard(p) {
  const info = metaOf(p);
  const li = el('li', 'card');

  const face = button('card-face', null, () => openSheet(p));
  face.setAttribute('aria-haspopup', 'dialog');
  const top = el('span', 'card-top');
  top.append(el('span', null, info ? [info.venue, info.year].filter(Boolean).join(' ') : host(p.url)));
  if (p.reviewed) top.append(el('span', 'badge', 'Reviewed'));
  const bottom = el('span', 'card-bottom');
  bottom.append(
    el('span', null, info ? firstAuthor(info) : ''),
    el('span', null, info?.cited != null ? `${fmt(info.cited)} citation${info.cited === 1 ? '' : 's'}` : ''),
  );
  face.append(top, el('span', 'card-title', titleOf(p)), bottom);

  const caption = el('div', 'caption');
  const who = el('span');
  p.people.forEach((w, i) => who.append(i ? ', ' : '', button('link', w.name, () => pick(w.name))));
  const tags = el('span', 'caption-tags');
  tags.append(...p.tags.map(t => tagButton(t, () => pick('#' + t))));
  caption.append(who, tags);
  li.append(face, caption);

  for (const note of p.notes) {
    const line = el('p', 'caption-note');
    appendNote(line, note.text);
    if (p.people.length > 1) line.append(' — ' + note.by);
    li.append(line);
  }

  li.dataset.text = [
    p.title, p.url, host(p.url),
    ...p.notes.map(n => n.text), ...p.people.map(w => w.name), ...p.tags.map(t => '#' + t),
    info?.title, ...(info?.authors || []), info?.year, info?.venue,
  ].filter(Boolean).join(' ').toLowerCase();
  return li;
}

// ---------- The paper sheet ----------

function fillSheet(p) {
  const info = metaOf(p);
  const head = el('div', 'sheet-head');
  const facts = [info?.venue, info?.year, info?.cited != null ? `${fmt(info.cited)} citations` : null, p.reviewed ? 'Reviewed' : 'To read'];
  const close = button('close', null, () => sheet.close());
  close.setAttribute('aria-label', 'Close');
  close.append(icon('close'));
  head.append(el('span', null, facts.filter(Boolean).join(' · ')), close);

  const title = el('h2', 'sheet-title', titleOf(p));
  title.id = 'sheet-title';
  const body = el('div', 'sheet-body');
  body.append(head, title);

  if (info?.authors.length) {
    const more = info.authors.length - 12;
    body.append(el('p', 'sheet-authors', info.authors.slice(0, 12).join(', ') + (more > 0 ? ` and ${more} more` : '')));
  }
  if (p.notes.length) {
    const notes = el('ul', 'sheet-notes');
    for (const note of p.notes) {
      const li = el('li');
      appendNote(li, note.text);
      li.append(el('span', 'by', ' — ' + note.by));
      notes.append(li);
    }
    body.append(notes);
  }
  if (info?.abstract) body.append(el('p', 'sheet-abstract', info.abstract));

  const actions = el('div', 'actions');
  const open = link(p.url, 'Open paper', 'pill solid');
  open.append(icon('out'));
  actions.append(open);
  if (info?.bibtex) {
    const copy = button('pill outline', 'Copy BibTeX', async () => {
      try { await navigator.clipboard.writeText(info.bibtex); copy.textContent = 'Copied'; }
      catch { copy.textContent = "Couldn't copy"; }
      setTimeout(() => { copy.textContent = 'Copy BibTeX'; }, 1500);
    });
    actions.append(copy);
  }
  const onMap = el('a', 'pill outline', 'See it on the map');
  onMap.href = 'map.html#paper=' + encodeURIComponent(p.key);
  actions.append(onMap);
  body.append(actions);

  const meta = el('div', 'sheet-meta');
  const who = el('span', null, 'Listed by ');
  p.people.forEach((w, i) => who.append(i ? ', ' : '', button('link', w.name, () => { sheet.close(); pick(w.name); })));
  const tags = el('span', 'caption-tags');
  tags.append(...p.tags.map(t => tagButton(t, () => { sheet.close(); pick('#' + t); })));
  meta.append(who, tags, el('span', null, host(p.url)));
  body.append(meta);

  sheet.replaceChildren(body);
}

function openSheet(p) {
  openKey = p.key;
  fillSheet(p);
  if (!sheet.open) sheet.showModal();
  writeHash();
}

// Show the paper named in the URL (#paper=arxiv:2103.00020), once the lists have it.
function syncSheet() {
  const p = openKey && papers.find(x => x.key === openKey);
  if (p) {
    fillSheet(p);
    if (!sheet.open) sheet.showModal();
  } else if (!openKey && sheet.open) {
    sheet.close();
  }
}

// ---------- Filtering, sorting and the URL ----------

// Searches, sorts, the view and the open paper live in the URL (#q=%23vlm&sort=title), so a view can be shared.
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  search.value = h.get('q') || '';
  sortBy = Object.hasOwn(SORTS, h.get('sort')) ? h.get('sort') : 'person';
  view = ['tbd', 'reviewed'].includes(h.get('view')) ? h.get('view') : 'all';
  openKey = h.get('paper');
}

function writeHash() {
  const h = new URLSearchParams();
  if (search.value.trim()) h.set('q', search.value.trim());
  if (sortBy !== 'person') h.set('sort', sortBy);
  if (view !== 'all') h.set('view', view);
  if (openKey) h.set('paper', openKey);
  const hash = h.toString() ? '#' + h : '';
  if (hash !== location.hash) history.replaceState(null, '', hash || location.pathname + location.search);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  for (const key of ['queue', 'reviewed']) {
    const items = [...$(key).children];
    let shown = 0;
    for (const li of items) {
      li.hidden = !terms.every(t => li.dataset.text.includes(t));
      if (!li.hidden) shown++;
    }
    $(key + '-count').textContent = items.length ? shown : '';
    const empty = $(key + '-empty');
    empty.textContent = items.length ? 'No matches.' : 'Nothing here yet.';
    empty.hidden = shown > 0;
  }
  $('queue-section').hidden = view === 'reviewed';
  $('reviewed-section').hidden = view === 'tbd' || (view === 'all' && $('reviewed').children.length === 0);

  pressSide(q);
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', b.dataset.view === view);
  $('sort').value = sortBy;
  writeHash();
}

function showNotice(lines) {
  const box = $('notice');
  box.replaceChildren(...lines.map(t => el('p', null, t)));
  box.hidden = lines.length === 0;
}

const SORTS = {
  person: (a, b) => collator.compare(a.people[0].name, b.people[0].name) || a.order - b.order,
  title: (a, b) => collator.compare(titleOf(a), titleOf(b)) || a.order - b.order,
  wanted: (a, b) => b.people.length - a.people.length || SORTS.person(a, b),
  newest: (a, b) => yearOf(b) - yearOf(a) || SORTS.person(a, b),
  cited: (a, b) => citedOf(b) - citedOf(a) || SORTS.person(a, b),
};

function drawSidebar() {
  const q = search.value.trim().toLowerCase();
  const tags = tally(papers.flatMap(p => p.tags));
  sideGroup($('tag-group'), 'Tags', [
    { q: '', label: 'All papers', n: papers.length },
    ...tags.map(t => ({ q: '#' + t.name, label: t.name, n: t.n, color: isTopic(t.name) ? colors.get(t.key) : null })),
  ], setQuery, q);
  const people = tally(papers.flatMap(p => p.people.map(w => w.name)));
  sideGroup($('people-group'), 'People', people.map(t => ({ q: t.name, label: t.name, n: t.n })), setQuery, q);
}

function draw() {
  colors = tagColors(tally(papers.flatMap(p => p.tags)));
  const sorted = [...papers].sort(SORTS[sortBy]);
  $('queue').replaceChildren(...sorted.filter(p => !p.reviewed).map(renderCard));
  $('reviewed').replaceChildren(...sorted.filter(p => p.reviewed).map(renderCard));
  drawSidebar();
  filter();
  syncSheet();
}

function render(files, notes = []) {
  const collected = collect(files);
  papers = collected.papers;
  showNotice([...notes, ...collected.problems]);
  draw();
}

// ---------- Start ----------

for (const a of document.querySelectorAll('.add, .source')) a.href = `https://github.com/${REPO}/tree/${BRANCH}/${REPO_DIR}`;
for (const a of document.querySelectorAll('.repo')) a.href = `https://github.com/${REPO}`;

search.addEventListener('input', filter);
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { search.value = ''; filter(); }
});
$('sort').addEventListener('change', () => { sortBy = $('sort').value; draw(); });
for (const b of document.querySelectorAll('[data-view]')) {
  b.addEventListener('click', () => { view = b.dataset.view; filter(); });
}
sheet.addEventListener('close', () => { openKey = null; writeHash(); });
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); }); // the backdrop
window.addEventListener('hashchange', () => { readHash(); draw(); });
readHash();
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search && !sheet.open && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    search.focus();
  }
});

// Show the copy this browser saw last time right away, then refresh it.
let saved = null;
try { saved = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch {}
if (saved && Array.isArray(saved.files)) render(saved.files);
else saved = null;

loadFiles()
  .then(files => {
    render(files);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ files })); } catch {}
  })
  .catch(err => {
    if (saved) render(saved.files, [`Showing the last copy this browser loaded. ${err.message}`]);
    else $('queue-empty').textContent = `Couldn't load the list. ${err.message}`;
  })
  // Paper details are extras: if the lookup fails, the list works without them.
  .then(() => loadMeta(papers))
  .then(changed => { if (changed) draw(); })
  .catch(err => console.warn(`Couldn't look papers up on Semantic Scholar. ${err.message}`));
</script>
</body>
</html>
