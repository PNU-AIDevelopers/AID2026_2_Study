<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIR Paper Queue</title>
<meta name="description" content="Papers the AIR study group wants to read, and the ones we've reviewed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' rx='2' fill='none' stroke='%23888' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #17171a;
    --muted: #6f6f78;
    --line: #e4e4e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --fg: #e9e9ec;
      --muted: #9b9ba4;
      --line: #2c2c31;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; padding: clamp(40px, 9vw, 96px) 16px 80px; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }

  h1 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
  .lede { margin: 0; color: var(--muted); }
  .lede a, footer a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .lede a:hover, footer a:hover { text-decoration-color: currentColor; }

  #q {
    display: block;
    width: 100%;
    margin: 40px 0 0;
    padding: 10px 0;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #q:focus { border-bottom-color: var(--fg); }
  #q::placeholder { color: var(--muted); }

  #facets { margin-top: 16px; font-size: .8125rem; color: var(--muted); }
  .facet { display: flex; margin: 0; }
  .facet + .facet { margin-top: 6px; }
  .facet-label { flex: none; width: 3.25rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 2px 14px; min-width: 0; }
  .chip .n { margin-left: .35em; opacity: .75; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

  #notice { margin-top: 16px; font-size: .8125rem; color: var(--muted); }
  #notice p { margin: 0; }

  section { margin-top: 44px; }
  h2 {
    margin: 0 0 18px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h2 span { margin-left: .6em; font-weight: 400; font-variant-numeric: tabular-nums; }

  ol { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 22px; }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .why { margin: 2px 0 0; overflow-wrap: anywhere; }
  .why a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .by, .meta, .info { color: var(--muted); }
  .meta, .info { margin: 4px 0 0; font-size: .8125rem; }
  .info { margin-top: 2px; }
  .abstract { margin: 8px 0 0; font-size: .875rem; overflow-wrap: anywhere; }
  .tag, .chip, .act { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .tag:hover, .chip:hover, .act:hover { color: var(--fg); }
  .act { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .empty { margin: 0; color: var(--muted); }

  footer { margin-top: 72px; font-size: .8125rem; color: var(--muted); }
  footer p { margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AIR Paper Queue</h1>
    <p class="lede">Papers we want to read, and the ones we've reviewed. <a id="add" href="https://github.com/cho104/AIResearchers/tree/main/docs/papers" target="_blank" rel="noopener">Add yours</a></p>
  </header>

  <input id="q" type="search" placeholder="Search titles, authors, people, #tags" aria-label="Search papers" autocomplete="off" spellcheck="false">
  <div id="facets" hidden>
    <p class="facet" id="tag-chips" aria-label="Filter by tag"></p>
    <p class="facet" id="people-chips" aria-label="Filter by person"></p>
    <p class="facet" id="sorts" aria-label="Sort papers">
      <span class="facet-label">Sort</span>
      <span class="chips">
        <button class="chip" type="button" data-sort="person">person</button>
        <button class="chip" type="button" data-sort="title">title</button>
        <button class="chip" type="button" data-sort="wanted">most wanted</button>
      </span>
    </p>
  </div>
  <div id="notice" role="status" hidden></div>

  <section aria-labelledby="queue-h">
    <h2 id="queue-h">TBD<span id="queue-count"></span></h2>
    <ol id="queue"></ol>
    <p id="queue-empty" class="empty">Loading…</p>
    <noscript><p class="empty">This page needs JavaScript. The lists themselves are in docs/papers/ on GitHub.</p></noscript>
  </section>

  <section id="reviewed-section" aria-labelledby="reviewed-h" hidden>
    <h2 id="reviewed-h">Reviewed<span id="reviewed-count"></span></h2>
    <ol id="reviewed"></ol>
    <p id="reviewed-empty" class="empty" hidden></p>
  </section>

  <footer>
    <p>One list per person in <a id="source" href="https://github.com/cho104/AIResearchers/tree/main/docs/papers" target="_blank" rel="noopener">docs/papers/</a>. Merged PRs show up here within a few minutes.</p>
  </footer>
</main>

<script>
// Where the lists live. Change these if the repo moves.
const REPO = 'cho104/AIResearchers';
const BRANCH = 'main';
const DIR = 'papers';           // next to this page on the site
const REPO_DIR = 'docs/papers'; // the same folder in the repo
const CACHE_KEY = 'air-paper-queue';
const META_KEY = 'air-paper-meta';
const META_TTL = 7 * 24 * 60 * 60 * 1000; // look papers up again weekly, for citation counts
const S2_BATCH = 'https://api.semanticscholar.org/graph/v1/paper/batch';
const S2_FIELDS = 'title,authors,year,venue,publicationVenue,citationCount,abstract,citationStyles';

const MD_LINK = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/;
const BARE_LINK = /<?(https?:\/\/[^\s<>]+)>?/;
const TAG = /(^|\s)#([\p{L}\p{N}][\p{L}\p{N}_-]*)/gu;

const $ = id => document.getElementById(id);
const search = $('q');

// ---------- Finding and fetching the lists ----------

function isListFile(name) {
  return /\.(md|json)$/i.test(name) && !/^readme\.md$/i.test(name) && !/^[_.]/.test(name) && !name.includes('/');
}

// GitHub Pages can't list a folder, so ask the GitHub API what's in papers/.
// A local preview (python3 -m http.server) reads the server's folder listing instead.
async function listFiles() {
  if (!location.hostname.endsWith('github.io')) {
    try {
      const res = await fetch(DIR + '/', { cache: 'no-cache' });
      if (res.ok) {
        const page = new DOMParser().parseFromString(await res.text(), 'text/html');
        return [...page.querySelectorAll('a[href]')]
          .map(a => decodeURIComponent(a.getAttribute('href')))
          .filter(isListFile);
      }
    } catch {}
  }
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${REPO_DIR}?ref=${BRANCH}`);
  if (res.status === 404) return [];
  if (!res.ok) {
    const reset = Number(res.headers.get('x-ratelimit-reset'));
    if (res.headers.get('x-ratelimit-remaining') === '0' && reset) {
      const at = new Date(reset * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      throw new Error(`GitHub's API limit was reached. Try again after ${at}.`);
    }
    throw new Error(`GitHub answered ${res.status}.`);
  }
  return (await res.json()).filter(f => f.type === 'file').map(f => f.name).filter(isListFile);
}

async function loadFiles() {
  const names = await listFiles();
  const files = await Promise.all(names.map(async name => {
    try {
      const res = await fetch(`${DIR}/${encodeURIComponent(name)}`, { cache: 'no-cache' });
      // A file merged a moment ago may not be deployed yet; it'll appear on the next visit.
      return res.ok ? { name, text: await res.text() } : null;
    } catch { return null; }
  }));
  return files.filter(Boolean);
}

// ---------- Parsing ----------

const plain = s => s.replace(/\*\*|`/g, '').replace(/\s+/g, ' ').trim();

// "- [Title](link) — why #tag #reviewed", or just "- link".
function parseLine(text) {
  const md = text.match(MD_LINK), bare = text.match(BARE_LINK);
  let match, url, title = null;
  if (md && md.index < bare.index) { match = md; url = md[2]; title = plain(md[1]); }
  else if (bare) { match = bare; url = bare[1].replace(/[.,;:!?)\]]+$/, ''); }
  else return null;

  let reviewed = false;
  const tags = [];
  const rest = (text.slice(0, match.index) + ' ' + text.slice(match.index + match[0].length))
    .replace(TAG, (_, space, tag) => {
      const status = tag.toLowerCase();
      if (status === 'reviewed') reviewed = true;
      else if (status !== 'tbd') tags.push(tag);
      return space;
    });
  const why = plain(rest).replace(/^[\s:|·•–—-]+|[\s:|·•–—-]+$/g, '');
  return { url, title, why, tags, reviewed };
}

function parseMarkdown(text, fallbackName) {
  let name = null, fenced = false;
  const papers = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (/^\s*(```|~~~)/.test(line)) { fenced = !fenced; return; }
    if (fenced) return;
    const heading = line.match(/^#\s+(.+?)\s*#*\s*$/);
    if (heading) { name ??= heading[1]; return; }
    // Only top-level list items count; indented lines are the author's own notes.
    const item = line.match(/^(?:[-*+]|\d+[.)])\s+(?:\[[ xX]\]\s+)?(.*)$/);
    const paper = item && parseLine(item[1]);
    if (paper) papers.push({ ...paper, line: i + 1 });
  });
  return { name: name || fallbackName, papers, problems: [] };
}

function parseJSON(text, fallbackName) {
  const data = JSON.parse(text);
  const list = Array.isArray(data) ? data : data && data.papers;
  if (!Array.isArray(list)) throw new Error('expected {"name": "...", "papers": [...]}');
  const papers = [], problems = [];
  list.forEach((entry, i) => {
    const p = typeof entry === 'string' ? { link: entry } : entry || {};
    const url = String(p.link || p.url || '');
    if (!/^https?:\/\/\S+$/i.test(url)) return problems.push(`paper ${i + 1} needs an http(s) "link"`);
    const status = String(p.status || 'tbd').toLowerCase().replace(/^#/, '');
    if (status !== 'reviewed' && status !== 'tbd') problems.push(`paper ${i + 1}: status should be "reviewed" or "tbd"`);
    const tags = (Array.isArray(p.tags) ? p.tags : String(p.tags || '').split(/[\s,]+/))
      .map(t => String(t).replace(/^#/, '')).filter(Boolean);
    papers.push({ url, title: p.title ? plain(String(p.title)) : null, why: p.why ? plain(String(p.why)) : '', tags, reviewed: status === 'reviewed', line: null });
  });
  return { name: (!Array.isArray(data) && data.name && String(data.name)) || fallbackName, papers, problems };
}

// The same paper under different URLs (arXiv abs/pdf/versions, OpenReview forum/pdf) is one paper.
function paperKey(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const path = u.pathname.replace(/\/+$/, '');
    let m;
    if (/(^|\.)arxiv\.org$/.test(host) && (m = path.match(/^\/(?:abs|pdf|html)\/(.+?)(?:v\d+)?(?:\.pdf)?$/))) return 'arxiv:' + m[1];
    if (host === 'huggingface.co' && (m = path.match(/^\/papers\/(\d{4}\.\d{4,5})/))) return 'arxiv:' + m[1];
    if (host === 'openreview.net' && u.searchParams.get('id')) return 'openreview:' + u.searchParams.get('id');
    return host + path + u.search;
  } catch { return url; }
}

function collect(files) {
  const byKey = new Map(), problems = [];
  for (const file of files) {
    const stem = file.name.replace(/\.(md|json)$/i, '');
    let list;
    try {
      list = /\.json$/i.test(file.name) ? parseJSON(file.text, stem) : parseMarkdown(file.text, stem);
    } catch (err) {
      problems.push(`Couldn't read ${REPO_DIR}/${file.name}: ${err.message}`);
      continue;
    }
    list.problems.forEach(p => problems.push(`Skipped in ${REPO_DIR}/${file.name}: ${p}`));
    for (const p of list.papers) {
      const key = paperKey(p.url);
      let paper = byKey.get(key);
      if (!paper) byKey.set(key, paper = { key, order: byKey.size, url: p.url, title: null, reviewed: false, tags: [], notes: [], people: [] });
      paper.title ||= p.title;
      paper.reviewed ||= p.reviewed;
      for (const t of p.tags) if (!paper.tags.some(x => x.toLowerCase() === t.toLowerCase())) paper.tags.push(t);
      if (!paper.people.some(w => w.name === list.name)) paper.people.push({ name: list.name, file: file.name, line: p.line });
      if (p.why) paper.notes.push({ text: p.why, by: list.name });
    }
  }
  return { papers: [...byKey.values()], problems };
}

// ---------- Authors, venue and abstract from Semantic Scholar ----------

let lookups = {}; // paper key -> { at: when we looked, d: details or null }
try { lookups = JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch {}

// The ID Semantic Scholar knows a paper by, or null for sites it can't look up (like OpenReview).
function s2Id(paper) {
  if (paper.key.startsWith('arxiv:')) return 'ARXIV:' + paper.key.slice(6);
  try {
    const u = new URL(paper.url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    let m;
    if (host === 'doi.org' || host === 'dx.doi.org') return 'DOI:' + decodeURIComponent(u.pathname.slice(1));
    if (host === 'semanticscholar.org' && (m = u.pathname.match(/([0-9a-f]{40})\/?$/))) return m[1];
    if (host === 'aclanthology.org' && (m = u.pathname.match(/^\/([^/]+?)(?:\.pdf)?\/?$/))) return 'ACL:' + m[1];
    if (/(^|\.)(aclweb\.org|acm\.org|biorxiv\.org)$/.test(host)) return 'URL:' + paper.url;
  } catch {}
  return null;
}

// Keep only what the page shows. Venues use their short name (CVPR, ICLR) when there is one.
function trimMeta(d) {
  if (!d) return null;
  const short = (d.publicationVenue?.alternate_names || []).find(n => !/\s/.test(n) && n.length <= 10);
  let venue = short || d.venue || '';
  if (/^arxiv(\.org)?$/i.test(venue)) venue = 'arXiv';
  return {
    title: d.title || null,
    authors: (d.authors || []).map(a => a.name).filter(Boolean),
    year: d.year || null,
    venue,
    cited: d.citationCount ?? null,
    abstract: d.abstract || '',
    bibtex: d.citationStyles?.bibtex || '',
  };
}

const metaOf = p => lookups[p.key]?.d || null;

// The free API is often busy (429, which the browser only sees as a failed fetch), so try a few times.
async function s2Batch(ids) {
  let error;
  for (const wait of [0, 2000, 5000]) {
    await new Promise(r => setTimeout(r, wait));
    try {
      const res = await fetch(`${S2_BATCH}?fields=${S2_FIELDS}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids }),
      });
      if (res.ok) return await res.json();
      error = new Error(`Semantic Scholar answered ${res.status}.`);
    } catch (err) { error = err; }
  }
  throw error;
}

// Look up papers we haven't seen (or not this week) in one request. Returns whether anything changed.
async function loadMeta(list) {
  const now = Date.now();
  const todo = list.map(p => ({ key: p.key, id: s2Id(p) }))
    .filter(x => x.id && !(lookups[x.key] && now - lookups[x.key].at < META_TTL));
  for (let i = 0; i < todo.length; i += 500) {
    const chunk = todo.slice(i, i + 500);
    const found = await s2Batch(chunk.map(x => x.id));
    chunk.forEach((x, j) => { lookups[x.key] = { at: now, d: trimMeta(found[j]) }; });
  }
  if (todo.length) try { localStorage.setItem(META_KEY, JSON.stringify(lookups)); } catch {}
  return todo.length > 0;
}

// ---------- Rendering ----------

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function link(href, text, cls) {
  const a = el('a', cls, text);
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

const host = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
const shortUrl = url => url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');

// Notes are plain text, except that links inside them stay clickable.
function appendNote(node, text) {
  const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>]*[^\s<>.,;:!?)\]])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    node.append(text.slice(last, m.index), link(m[2] || m[3], m[1] || shortUrl(m[3])));
    last = re.lastIndex;
  }
  node.append(text.slice(last));
}

function button(cls, text, onClick) {
  const b = el('button', cls, text);
  b.type = 'button';
  b.addEventListener('click', onClick);
  return b;
}

// Clicking the tag or name that's already the search clears it.
function setQuery(q) {
  search.value = search.value.trim().toLowerCase() === q.toLowerCase() ? '' : q;
  filter();
  search.scrollIntoView({ block: 'nearest' });
}

const titleOf = p => p.title || metaOf(p)?.title || shortUrl(p.url);

// "Kaiming He et al. · 2021 · CVPR · 13,058 citations · Abstract · BibTeX", with the abstract under it.
function appendInfo(li, info) {
  const line = el('p', 'info'), parts = [];
  if (info.authors.length) parts.push(info.authors[0] + (info.authors.length > 1 ? ' et al.' : ''));
  if (info.year) parts.push(String(info.year));
  if (info.venue) parts.push(info.venue);
  if (info.cited != null) parts.push(`${info.cited.toLocaleString('en')} citation${info.cited === 1 ? '' : 's'}`);

  const abstract = el('p', 'abstract', info.abstract);
  abstract.hidden = true;
  if (info.abstract) {
    const toggle = button('act', 'Abstract', () => {
      abstract.hidden = !abstract.hidden;
      toggle.setAttribute('aria-expanded', !abstract.hidden);
    });
    toggle.setAttribute('aria-expanded', false);
    parts.push(toggle);
  }
  if (info.bibtex) {
    const copy = button('act', 'BibTeX', async () => {
      try { await navigator.clipboard.writeText(info.bibtex); copy.textContent = 'Copied'; }
      catch { copy.textContent = "Couldn't copy"; }
      setTimeout(() => { copy.textContent = 'BibTeX'; }, 1500);
    });
    copy.title = 'Copy BibTeX';
    parts.push(copy);
  }

  if (!parts.length) return;
  parts.forEach((part, i) => line.append(i ? ' · ' : '', part));
  li.append(line);
  if (info.abstract) li.append(abstract);
}

function renderPaper(p) {
  const li = el('li');
  const info = metaOf(p);
  li.append(link(p.url, titleOf(p), 'title'));
  if (info) appendInfo(li, info);

  for (const note of p.notes) {
    const why = el('p', 'why');
    appendNote(why, note.text);
    if (p.people.length > 1) why.append(el('span', 'by', ' — ' + note.by));
    li.append(why);
  }

  const meta = el('p', 'meta');
  p.people.forEach((who, i) => meta.append(i ? ', ' : '', button('tag', who.name, () => setQuery(who.name))));
  meta.append(' · ' + host(p.url));
  p.tags.forEach((t, i) => meta.append(i ? ' ' : ' · ', button('tag', '#' + t, () => setQuery('#' + t))));
  li.append(meta);

  li.dataset.text = [
    p.title, p.url, host(p.url),
    ...p.notes.map(n => n.text), ...p.people.map(w => w.name), ...p.tags.map(t => '#' + t),
    info?.title, ...(info?.authors || []), info?.year, info?.venue,
  ].filter(Boolean).join(' ').toLowerCase();
  return li;
}

// The tag and people rows above the list, most used first.
function chipRow(id, label, names) {
  const counts = new Map();
  for (const name of names) {
    const c = counts.get(name.toLowerCase()) || { name, n: 0 };
    c.n++;
    counts.set(name.toLowerCase(), c);
  }
  const chips = [...counts.values()]
    .sort((a, b) => b.n - a.n || collator.compare(a.name, b.name))
    .map(c => {
      const chip = button('chip', c.name, () => setQuery(c.name));
      chip.dataset.q = c.name.toLowerCase();
      chip.append(el('span', 'n', c.n));
      return chip;
    });
  const wrap = el('span', 'chips');
  wrap.append(...chips);
  $(id).replaceChildren(el('span', 'facet-label', label), wrap);
  $(id).hidden = chips.length === 0;
}

// Searches and sorts live in the URL (#q=%23vlm&sort=title), so a filtered view can be shared.
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  search.value = h.get('q') || '';
  sortBy = Object.hasOwn(SORTS, h.get('sort')) ? h.get('sort') : 'person';
}

function writeHash() {
  const h = new URLSearchParams();
  if (search.value.trim()) h.set('q', search.value.trim());
  if (sortBy !== 'person') h.set('sort', sortBy);
  const hash = h.toString() ? '#' + h : '';
  if (hash !== location.hash) history.replaceState(null, '', hash || location.pathname + location.search);
}

function filter() {
  const terms = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  for (const key of ['queue', 'reviewed']) {
    const items = [...$(key).children];
    let shown = 0;
    for (const li of items) {
      li.hidden = !terms.every(t => li.dataset.text.includes(t));
      if (!li.hidden) shown++;
    }
    $(key + '-count').textContent = items.length ? shown : '';
    const empty = $(key + '-empty');
    empty.textContent = items.length ? 'No matches.' : 'Nothing here yet.';
    empty.hidden = shown > 0;
  }
  $('reviewed-section').hidden = $('reviewed').children.length === 0;

  const q = search.value.trim().toLowerCase();
  for (const chip of $('facets').querySelectorAll('[data-q]')) chip.setAttribute('aria-pressed', chip.dataset.q === q);
  for (const b of $('facets').querySelectorAll('[data-sort]')) b.setAttribute('aria-pressed', b.dataset.sort === sortBy);
  writeHash();
}

function showNotice(lines) {
  const box = $('notice');
  box.replaceChildren(...lines.map(t => el('p', null, t)));
  box.hidden = lines.length === 0;
}

const collator = new Intl.Collator(['ko', 'en'], { numeric: true, sensitivity: 'base' });
const SORTS = {
  person: (a, b) => collator.compare(a.people[0].name, b.people[0].name) || a.order - b.order,
  title: (a, b) => collator.compare(titleOf(a), titleOf(b)) || a.order - b.order,
  wanted: (a, b) => b.people.length - a.people.length || SORTS.person(a, b),
};

let papers = [], sortBy = 'person';

function draw() {
  const sorted = [...papers].sort(SORTS[sortBy]);
  $('queue').replaceChildren(...sorted.filter(p => !p.reviewed).map(renderPaper));
  $('reviewed').replaceChildren(...sorted.filter(p => p.reviewed).map(renderPaper));
  chipRow('tag-chips', 'Tags', papers.flatMap(p => p.tags.map(t => '#' + t)));
  chipRow('people-chips', 'People', papers.flatMap(p => p.people.map(w => w.name)));
  $('facets').hidden = papers.length === 0;
  filter();
}

function render(files, notes = []) {
  const collected = collect(files);
  papers = collected.papers;
  showNotice([...notes, ...collected.problems]);
  draw();
}

// ---------- Start ----------

for (const id of ['add', 'source']) $(id).href = `https://github.com/${REPO}/tree/${BRANCH}/${REPO_DIR}`;

search.addEventListener('input', filter);
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { search.value = ''; filter(); }
});
for (const b of $('facets').querySelectorAll('[data-sort]')) {
  b.addEventListener('click', () => { sortBy = b.dataset.sort; draw(); });
}
window.addEventListener('hashchange', () => { readHash(); draw(); });
readHash();
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    search.focus();
  }
});

// Show the copy this browser saw last time right away, then refresh it.
let saved = null;
try { saved = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch {}
if (saved && Array.isArray(saved.files)) render(saved.files);
else saved = null;

loadFiles()
  .then(files => {
    render(files);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ files })); } catch {}
  })
  .catch(err => {
    if (saved) render(saved.files, [`Showing the last copy this browser loaded. ${err.message}`]);
    else $('queue-empty').textContent = `Couldn't load the list. ${err.message}`;
  })
  // Paper details are extras: if the lookup fails, the list works without them.
  .then(() => loadMeta(papers))
  .then(changed => { if (changed) draw(); })
  .catch(err => console.warn(`Couldn't look papers up on Semantic Scholar. ${err.message}`));
</script>
</body>
</html>
