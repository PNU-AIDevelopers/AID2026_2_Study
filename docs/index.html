<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIR Paper Queue</title>
<meta name="description" content="Papers the AIR study group wants to read, and the ones we've reviewed.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' rx='2' fill='none' stroke='%23888' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #17171a;
    --muted: #6f6f78;
    --line: #e4e4e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --fg: #e9e9ec;
      --muted: #9b9ba4;
      --line: #2c2c31;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; padding: clamp(40px, 9vw, 96px) 16px 80px; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }

  h1 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; }
  .lede { margin: 0; color: var(--muted); }
  .lede a, footer a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .lede a:hover, footer a:hover { text-decoration-color: currentColor; }

  #q {
    display: block;
    width: 100%;
    margin: 40px 0 0;
    padding: 10px 0;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  #q:focus { border-bottom-color: var(--fg); }
  #q::placeholder { color: var(--muted); }

  #notice { margin-top: 16px; font-size: .8125rem; color: var(--muted); }
  #notice p { margin: 0; }

  section { margin-top: 44px; }
  h2 {
    margin: 0 0 18px;
    font-size: .75rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h2 span { margin-left: .6em; font-weight: 400; font-variant-numeric: tabular-nums; }

  ol { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 22px; }
  .title { font-weight: 500; overflow-wrap: anywhere; }
  .why { margin: 2px 0 0; overflow-wrap: anywhere; }
  .why a { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .by, .meta { color: var(--muted); }
  .meta { margin: 4px 0 0; font-size: .8125rem; }
  .tag { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .tag:hover { color: var(--fg); }
  .empty { margin: 0; color: var(--muted); }

  footer { margin-top: 72px; font-size: .8125rem; color: var(--muted); }
  footer p { margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AIR Paper Queue</h1>
    <p class="lede">Papers we want to read, and the ones we've reviewed. <a id="add" href="https://github.com/cho104/AIResearchers/tree/main/docs/papers" target="_blank" rel="noopener">Add yours</a></p>
  </header>

  <input id="q" type="search" placeholder="Search titles, people, #tags" aria-label="Search papers" autocomplete="off" spellcheck="false">
  <div id="notice" role="status" hidden></div>

  <section aria-labelledby="queue-h">
    <h2 id="queue-h">TBD<span id="queue-count"></span></h2>
    <ol id="queue"></ol>
    <p id="queue-empty" class="empty">Loading…</p>
    <noscript><p class="empty">This page needs JavaScript. The lists themselves are in docs/papers/ on GitHub.</p></noscript>
  </section>

  <section id="reviewed-section" aria-labelledby="reviewed-h" hidden>
    <h2 id="reviewed-h">Reviewed<span id="reviewed-count"></span></h2>
    <ol id="reviewed"></ol>
    <p id="reviewed-empty" class="empty" hidden></p>
  </section>

  <footer>
    <p>One list per person in <a id="source" href="https://github.com/cho104/AIResearchers/tree/main/docs/papers" target="_blank" rel="noopener">docs/papers/</a>. Merged PRs show up here within a few minutes.</p>
  </footer>
</main>

<script>
// Where the lists live. Change these if the repo moves.
const REPO = 'cho104/AIResearchers';
const BRANCH = 'main';
const DIR = 'papers';           // next to this page on the site
const REPO_DIR = 'docs/papers'; // the same folder in the repo
const CACHE_KEY = 'air-paper-queue';

const MD_LINK = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/;
const BARE_LINK = /<?(https?:\/\/[^\s<>]+)>?/;
const TAG = /(^|\s)#([\p{L}\p{N}][\p{L}\p{N}_-]*)/gu;

const $ = id => document.getElementById(id);
const search = $('q');

// ---------- Finding and fetching the lists ----------

function isListFile(name) {
  return /\.(md|json)$/i.test(name) && !/^readme\.md$/i.test(name) && !/^[_.]/.test(name) && !name.includes('/');
}

// GitHub Pages can't list a folder, so ask the GitHub API what's in papers/.
// A local preview (python3 -m http.server) reads the server's folder listing instead.
async function listFiles() {
  if (!location.hostname.endsWith('github.io')) {
    try {
      const res = await fetch(DIR + '/', { cache: 'no-cache' });
      if (res.ok) {
        const page = new DOMParser().parseFromString(await res.text(), 'text/html');
        return [...page.querySelectorAll('a[href]')]
          .map(a => decodeURIComponent(a.getAttribute('href')))
          .filter(isListFile);
      }
    } catch {}
  }
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${REPO_DIR}?ref=${BRANCH}`);
  if (res.status === 404) return [];
  if (!res.ok) {
    const reset = Number(res.headers.get('x-ratelimit-reset'));
    if (res.headers.get('x-ratelimit-remaining') === '0' && reset) {
      const at = new Date(reset * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      throw new Error(`GitHub's API limit was reached. Try again after ${at}.`);
    }
    throw new Error(`GitHub answered ${res.status}.`);
  }
  return (await res.json()).filter(f => f.type === 'file').map(f => f.name).filter(isListFile);
}

async function loadFiles() {
  const names = await listFiles();
  const files = await Promise.all(names.map(async name => {
    try {
      const res = await fetch(`${DIR}/${encodeURIComponent(name)}`, { cache: 'no-cache' });
      // A file merged a moment ago may not be deployed yet; it'll appear on the next visit.
      return res.ok ? { name, text: await res.text() } : null;
    } catch { return null; }
  }));
  return files.filter(Boolean);
}

// ---------- Parsing ----------

const plain = s => s.replace(/\*\*|`/g, '').replace(/\s+/g, ' ').trim();

// "- [Title](link) — why #tag #reviewed", or just "- link".
function parseLine(text) {
  const md = text.match(MD_LINK), bare = text.match(BARE_LINK);
  let match, url, title = null;
  if (md && md.index < bare.index) { match = md; url = md[2]; title = plain(md[1]); }
  else if (bare) { match = bare; url = bare[1].replace(/[.,;:!?)\]]+$/, ''); }
  else return null;

  let reviewed = false;
  const tags = [];
  const rest = (text.slice(0, match.index) + ' ' + text.slice(match.index + match[0].length))
    .replace(TAG, (_, space, tag) => {
      const status = tag.toLowerCase();
      if (status === 'reviewed') reviewed = true;
      else if (status !== 'tbd') tags.push(tag);
      return space;
    });
  const why = plain(rest).replace(/^[\s:|·•–—-]+|[\s:|·•–—-]+$/g, '');
  return { url, title, why, tags, reviewed };
}

function parseMarkdown(text, fallbackName) {
  let name = null, fenced = false;
  const papers = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (/^\s*(```|~~~)/.test(line)) { fenced = !fenced; return; }
    if (fenced) return;
    const heading = line.match(/^#\s+(.+?)\s*#*\s*$/);
    if (heading) { name ??= heading[1]; return; }
    // Only top-level list items count; indented lines are the author's own notes.
    const item = line.match(/^(?:[-*+]|\d+[.)])\s+(?:\[[ xX]\]\s+)?(.*)$/);
    const paper = item && parseLine(item[1]);
    if (paper) papers.push({ ...paper, line: i + 1 });
  });
  return { name: name || fallbackName, papers, problems: [] };
}

function parseJSON(text, fallbackName) {
  const data = JSON.parse(text);
  const list = Array.isArray(data) ? data : data && data.papers;
  if (!Array.isArray(list)) throw new Error('expected {"name": "...", "papers": [...]}');
  const papers = [], problems = [];
  list.forEach((entry, i) => {
    const p = typeof entry === 'string' ? { link: entry } : entry || {};
    const url = String(p.link || p.url || '');
    if (!/^https?:\/\/\S+$/i.test(url)) return problems.push(`paper ${i + 1} needs an http(s) "link"`);
    const status = String(p.status || 'tbd').toLowerCase().replace(/^#/, '');
    if (status !== 'reviewed' && status !== 'tbd') problems.push(`paper ${i + 1}: status should be "reviewed" or "tbd"`);
    const tags = (Array.isArray(p.tags) ? p.tags : String(p.tags || '').split(/[\s,]+/))
      .map(t => String(t).replace(/^#/, '')).filter(Boolean);
    papers.push({ url, title: p.title ? plain(String(p.title)) : null, why: p.why ? plain(String(p.why)) : '', tags, reviewed: status === 'reviewed', line: null });
  });
  return { name: (!Array.isArray(data) && data.name && String(data.name)) || fallbackName, papers, problems };
}

// The same paper under different URLs (arXiv abs/pdf/versions, OpenReview forum/pdf) is one paper.
function paperKey(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const path = u.pathname.replace(/\/+$/, '');
    let m;
    if (/(^|\.)arxiv\.org$/.test(host) && (m = path.match(/^\/(?:abs|pdf|html)\/(.+?)(?:v\d+)?(?:\.pdf)?$/))) return 'arxiv:' + m[1];
    if (host === 'huggingface.co' && (m = path.match(/^\/papers\/(\d{4}\.\d{4,5})/))) return 'arxiv:' + m[1];
    if (host === 'openreview.net' && u.searchParams.get('id')) return 'openreview:' + u.searchParams.get('id');
    return host + path + u.search;
  } catch { return url; }
}

function collect(files) {
  const byKey = new Map(), problems = [];
  for (const file of files) {
    const stem = file.name.replace(/\.(md|json)$/i, '');
    let list;
    try {
      list = /\.json$/i.test(file.name) ? parseJSON(file.text, stem) : parseMarkdown(file.text, stem);
    } catch (err) {
      problems.push(`Couldn't read ${REPO_DIR}/${file.name}: ${err.message}`);
      continue;
    }
    list.problems.forEach(p => problems.push(`Skipped in ${REPO_DIR}/${file.name}: ${p}`));
    for (const p of list.papers) {
      const key = paperKey(p.url);
      let paper = byKey.get(key);
      if (!paper) byKey.set(key, paper = { url: p.url, title: null, reviewed: false, tags: [], notes: [], people: [] });
      paper.title ||= p.title;
      paper.reviewed ||= p.reviewed;
      for (const t of p.tags) if (!paper.tags.some(x => x.toLowerCase() === t.toLowerCase())) paper.tags.push(t);
      if (!paper.people.some(w => w.name === list.name)) paper.people.push({ name: list.name, file: file.name, line: p.line });
      if (p.why) paper.notes.push({ text: p.why, by: list.name });
    }
  }
  return { papers: [...byKey.values()], problems };
}

// ---------- Rendering ----------

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function link(href, text, cls) {
  const a = el('a', cls, text);
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

const host = url => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; } };
const shortUrl = url => url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
const fileUrl = who => `https://github.com/${REPO}/blob/${BRANCH}/${REPO_DIR}/${encodeURIComponent(who.file)}`
  + (who.line ? `?plain=1#L${who.line}` : '');

// Notes are plain text, except that links inside them stay clickable.
function appendNote(node, text) {
  const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>]*[^\s<>.,;:!?)\]])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    node.append(text.slice(last, m.index), link(m[2] || m[3], m[1] || shortUrl(m[3])));
    last = re.lastIndex;
  }
  node.append(text.slice(last));
}

function renderPaper(p) {
  const li = el('li');
  li.append(link(p.url, p.title || shortUrl(p.url), 'title'));

  for (const note of p.notes) {
    const why = el('p', 'why');
    appendNote(why, note.text);
    if (p.people.length > 1) why.append(el('span', 'by', ' — ' + note.by));
    li.append(why);
  }

  const meta = el('p', 'meta');
  p.people.forEach((who, i) => meta.append(i ? ', ' : '', link(fileUrl(who), who.name)));
  meta.append(' · ' + host(p.url));
  p.tags.forEach((t, i) => {
    const tag = el('button', 'tag', '#' + t);
    tag.type = 'button';
    tag.addEventListener('click', () => {
      search.value = '#' + t;
      filter();
      search.scrollIntoView({ block: 'nearest' });
    });
    meta.append(i ? ' ' : ' · ', tag);
  });
  li.append(meta);

  li.dataset.text = [
    p.title, p.url, host(p.url),
    ...p.notes.map(n => n.text), ...p.people.map(w => w.name), ...p.tags.map(t => '#' + t),
  ].filter(Boolean).join(' ').toLowerCase();
  return li;
}

function filter() {
  const terms = search.value.toLowerCase().split(/\s+/).filter(Boolean);
  for (const key of ['queue', 'reviewed']) {
    const items = [...$(key).children];
    let shown = 0;
    for (const li of items) {
      li.hidden = !terms.every(t => li.dataset.text.includes(t));
      if (!li.hidden) shown++;
    }
    $(key + '-count').textContent = items.length ? shown : '';
    const empty = $(key + '-empty');
    empty.textContent = items.length ? 'No matches.' : 'Nothing here yet.';
    empty.hidden = shown > 0;
  }
  $('reviewed-section').hidden = $('reviewed').children.length === 0;
}

function showNotice(lines) {
  const box = $('notice');
  box.replaceChildren(...lines.map(t => el('p', null, t)));
  box.hidden = lines.length === 0;
}

function render(files, notes = []) {
  const { papers, problems } = collect(files);
  $('queue').replaceChildren(...papers.filter(p => !p.reviewed).map(renderPaper));
  $('reviewed').replaceChildren(...papers.filter(p => p.reviewed).map(renderPaper));
  showNotice([...notes, ...problems]);
  filter();
}

// ---------- Start ----------

for (const id of ['add', 'source']) $(id).href = `https://github.com/${REPO}/tree/${BRANCH}/${REPO_DIR}`;

search.addEventListener('input', filter);
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { search.value = ''; filter(); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== search && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    search.focus();
  }
});

// Show the copy this browser saw last time right away, then refresh it.
let saved = null;
try { saved = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch {}
if (saved && Array.isArray(saved.files)) render(saved.files);
else saved = null;

loadFiles()
  .then(files => {
    render(files);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ files })); } catch {}
  })
  .catch(err => {
    if (saved) render(saved.files, [`Showing the last copy this browser loaded. ${err.message}`]);
    else $('queue-empty').textContent = `Couldn't load the list. ${err.message}`;
  });
</script>
</body>
</html>
